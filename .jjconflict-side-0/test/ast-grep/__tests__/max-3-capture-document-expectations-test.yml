id: max-3-capture-document-expectations
valid:
- |
  await captureDocument(document, {
    name: "toast-styles-01",
    expectations: ["A", "B", "C"],
  });
- |
  await captureDocument(document, {
    name: "toast-styles-01",
    expectations: ["A"],
  });
- |
  logEvent({ expectations: ["A", "B", "C", "D"] });
invalid:
- |
  await captureDocument(document, {
    name: "toast-styles-01",
    expectations: ["A", "B", "C", "D"],
  });
- |
  await captureDocument(document, {
    name: "toast-styles-02",
    expectations: ["A", "B", "C", "D", "E", "F", "G"],
  });
