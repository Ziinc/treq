id: no-subprocess-conflict-pipeline-tauri-src
valid:
  - |
    fn parse(content: &str) {
      let _lines: Vec<&str> = content.lines().collect();
    }
invalid:
  - |
    fn parse() {
      let _ = std::process::Command::new("jj");
    }
  - |
    fn parse() {
      let _ = command_for("jj");
    }
  - |
    fn parse() {
      let _ = jj_command("git");
    }
