id: no-rest-tuple-destructure-src-ts
valid:
  - |
    export const run = (a: string, b?: number): Promise<void> =>
      invoke("cmd", { a, b });
  - |
    export function forwardConsole(...args: unknown[]) {
      original(...args);
    }
  - |
    function run(name: string): void {
      void name;
    }
invalid:
  - |
    export const ptyCreateSession = (
      ...args: [
        sessionId: string,
        workingDir?: string,
      ]
    ): Promise<void> => {
      const [sessionId, workingDir] = args;
      return invoke("pty_create_session", { sessionId, workingDir });
    };
