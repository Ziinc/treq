id: no-multiline-inline-comments-js-ts
language: typescript
severity: warning
message: >
  Keep inline comments inside code blocks to a single line. Use one concise comment
  line or move longer context to docs.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "src/**/*.js"
  - "src/**/*.jsx"
rule:
  kind: program
  # Disallow:
  # 1) consecutive indented // lines
  # 2) indented /* ... */ comments spanning multiple lines
  regex: (?ms)^\s{2,}//[^\n]*\n\s{2,}//[^\n]*|^\s{2,}/\*.*\n.*\*/
