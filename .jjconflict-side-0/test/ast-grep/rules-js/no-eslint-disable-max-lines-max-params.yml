id: no-eslint-disable-max-lines-max-params
language: typescript
severity: error
message: >
  Do not disable max-lines, max-params, or max-nested-callbacks via
  eslint-disable comments.
  Refactor the file/function instead of suppressing these rules.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "src/**/*.js"
  - "src/**/*.jsx"
  - "test/**/*.ts"
  - "test/**/*.tsx"
  - "test/**/*.js"
  - "test/**/*.jsx"
rule:
  kind: program
  regex: (?m)(?:/\\*|//)\\s*eslint-disable(?:-next-line|-line)?\\b[^\\n*]*(?:\\bmax-lines\\b|\\bmax-params\\b|\\bmax-nested-callbacks\\b)
