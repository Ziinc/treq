id: no-rest-tuple-destructure-src-ts
language: typescript
severity: error
message: >
  Do not use a typed rest tuple (...args: [...]) only to destructure into locals.
  Declare positional parameters with the same names and types instead.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
rule:
  any:
    - pattern: |
        (...$ARGS: [$$$TYPES])
        $$$ =>
        {
          const $DEST = $ARGS
          $$$BODY
        }
    - pattern: |
        async (...$ARGS: [$$$TYPES])
        $$$ =>
        {
          const $DEST = $ARGS
          $$$BODY
        }
    - pattern: |
        function $NAME(...$ARGS: [$$$TYPES]) {
          const $DEST = $ARGS
          $$$BODY
        }
