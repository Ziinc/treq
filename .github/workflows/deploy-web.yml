name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/screenshot/**"
      - "assets/screenshots/**"
      - "src/**"
      - "src-tauri/**"
      - "crates/treq-napi/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/screenshot/**"
      - "assets/screenshots/**"
      - "src/**"
      - "src-tauri/**"
      - "crates/treq-napi/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  landing-screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore NAPI addon cache
        id: napi-cache
        uses: actions/cache/restore@v4
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: napi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'crates/treq-napi/Cargo.toml', 'crates/treq-napi/build.rs', 'crates/treq-napi/src/**', 'crates/treq-napi/package.json', 'crates/treq-napi/package-lock.json') }}

      - name: Install Rust stable
        if: steps.napi-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install WebKit GTK headers
        if: steps.napi-cache.outputs.cache-hit != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      - name: Install npm dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: steps.napi-cache.outputs.cache-hit != 'true'
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target
            ./crates/treq-napi -> target

      - name: Build NAPI addon
        if: steps.napi-cache.outputs.cache-hit != 'true'
        run: |
          npm run build:napi
          ls -la crates/treq-napi/*.node || true
          find crates/treq-napi -name '*.node' -print
          if [ ! -f crates/treq-napi/treq-napi.linux-x64-gnu.node ]; then
            found=$(find crates/treq-napi -name 'treq-napi*.node' | head -n 1)
            if [ -n "$found" ]; then
              cp "$found" crates/treq-napi/treq-napi.linux-x64-gnu.node
            fi
          fi
          test -f crates/treq-napi/treq-napi.linux-x64-gnu.node

      - name: Save NAPI addon cache
        if: steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: napi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'crates/treq-napi/Cargo.toml', 'crates/treq-napi/build.rs', 'crates/treq-napi/src/**', 'crates/treq-napi/package.json', 'crates/treq-napi/package-lock.json') }}

      - name: Compile screenshot CSS
        run: npm run screenshot:css

      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Capture landing screenshots
        continue-on-error: true
        run: |
          CHROME=$(node -p "require('playwright-core').chromium.executablePath()")
          test -x "$CHROME"
          PLAYWRIGHT_CHROMIUM_PATH="$CHROME" npx vitest run --config vitest.screenshot.config.ts scripts/screenshot/specs/readme-*.spec.tsx

      - name: Assert landing screenshots
        run: node web/scripts/assert-landing-screenshots.mjs

      - name: Upload landing screenshots
        uses: actions/upload-artifact@v4
        with:
          name: landing-screenshots
          path: web/static/img
          if-no-files-found: error
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    needs: landing-screenshots
    defaults:
      run:
        shell: bash
        working-directory: web
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://treq.dev' || format('https://preview-{0}.treq-9zy.pages.dev', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-docs-build-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Download landing screenshots
        uses: actions/download-artifact@v4
        with:
          name: landing-screenshots
          path: /tmp/landing-screenshots
      - name: Place screenshots in Docusaurus static/img
        run: |
          find /tmp/landing-screenshots -type f -name '*.png' | sort
          node scripts/place-landing-screenshots.mjs /tmp/landing-screenshots
          ls -la static/img
          ls -la static/img/landing
      - name: Assert landing screenshots
        run: npm run assert:landing-screenshots
      - name: Build docs
        env:
          DOCUSAURUS_ENABLE_GTAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          SKIP_LANDING_SCREENSHOTS: "1"
        run: npm run build
      - name: Confirm screenshots in build output
        run: |
          python3 - <<'PY'
          import json, os, sys
          names = json.load(open("src/data/landing-screenshots.json"))
          missing = [n for n in names if not os.path.isfile(os.path.join("build/img/landing", n))]
          if missing:
              print("Missing from Docusaurus build:", ", ".join(missing))
              sys.exit(1)
          if not os.path.isfile("build/img/code.png"):
              print("Missing hero build/img/code.png")
              sys.exit(1)
          print(f"Landing screenshots in build: {len(names)}")
          print("build/img:", os.listdir("build/img"))
          print("build/img/landing:", os.listdir("build/img/landing"))
          PY
      - name: Publish to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install lighthouse
        run: npm install -g lighthouse
      - name: Run Lighthouse against preview site
        run: |
          lighthouse "https://preview-${{ github.event.pull_request.number }}.treq-9zy.pages.dev" \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.treq-9zy.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
