name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  docs-compilation:
    runs-on: ubuntu-latest
    name: ${{ matrix.task }}
    strategy:
      matrix:
        task: [typecheck, build]
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
