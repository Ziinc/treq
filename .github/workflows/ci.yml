name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/treq-napi/**"
      - "supabase/**"
      - "web/**"
      - "test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "vitest*.config.ts"
      - ".github/workflows/ci.yml"

jobs:
  # Compile the NAPI addon once; integration shards reuse the artifact so they
  # do not each pay a multi-minute Rust link.
  build-napi:
    name: build / napi / ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: install WebKit/GTK (napi links treq/tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target
            ./crates/treq-napi -> target

      - name: Build NAPI addon
        run: npm run build:napi

      - name: Upload NAPI addon
        uses: actions/upload-artifact@v4
        with:
          name: treq-napi-node
          path: crates/treq-napi/*.node
          if-no-files-found: error
          retention-days: 1

  ci:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
          # Unit tests: mocked Tauri, no NAPI/jj. Parallel file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:unit
          - platform: ubuntu-22.04
            kind: rust
            task: test
          - platform: macos-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        if: matrix.kind != 'js'
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install cargo-binstall
        if: matrix.kind == 'rust' && matrix.platform == 'ubuntu-22.04'
        uses: cargo-bins/cargo-binstall@main

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && matrix.kind != 'js'
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install git, jj, and gh CLI (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install git jj gh
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Install jj CLI (ubuntu)
        if: matrix.platform == 'ubuntu-22.04' && matrix.kind == 'rust'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo binstall --strategies crate-meta-data,compile jj-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install gh CLI (ubuntu)
        if: matrix.platform == 'ubuntu-22.04' && matrix.kind == 'rust'
        run: |
          (type -p wget >/dev/null || (sudo apt-get update && sudo apt-get install -y wget)) \
          && sudo mkdir -p -m 755 /etc/apt/keyrings \
          && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
          && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt-get update \
          && sudo apt-get install -y gh

      - name: Verify pinned tool versions
        if: matrix.kind == 'rust'
        run: |
          git --version
          jj --version
          if command -v gh >/dev/null 2>&1; then gh --version; fi

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: matrix.kind == 'rust'
        with:
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust' || matrix.kind == 'verify'
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi

  js-integration:
    name: js / test:integration (${{ matrix.shard }}/2) / ubuntu-22.04
    needs: build-napi
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        # cargo-binstall needs cargo on PATH; no WebKit — addon is prebuilt.
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install jj CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo binstall --strategies crate-meta-data,compile jj-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          jj --version

      - name: Install dependencies
        run: npm ci

      - name: Download NAPI addon
        uses: actions/download-artifact@v4
        with:
          name: treq-napi-node
          path: crates/treq-napi

      - name: Run integration shard
        run: npm run test:integration:run -- --shard=${{ matrix.shard }}/2
