name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "supabase/**"
      - "web/**"
      - "test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "vitest*.config.ts"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
          # Unit tests: mocked Tauri, no NAPI/jj. Parallel file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:unit
          # Integration tests: NAPI + real jj repos. Serial file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:integration
          - platform: ubuntu-22.04
            kind: rust
            task: test
          - platform: macos-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          # Pin major so NAPI cache keys stay stable across LTS patch bumps.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Exact-key cache of the compiled addon. Frontend-only PRs restore the
      # binary built on main when Rust inputs are unchanged. Node is omitted
      # from the key: N-API (napi8) binaries are ABI-stable across Node majors
      # we care about; including `lts/*` patch versions busted the cache.
      - name: Restore NAPI addon cache
        id: napi-cache
        if: matrix.task == 'test:integration'
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/libtreq_lib.so
            src-tauri/target/index.js
          key: napi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'src-tauri/package.json', 'crates/tauri-test-macros/**') }}

      - name: Install Rust stable
        # Unit JS tests never need Rust. Integration skips the toolchain when
        # the prebuilt .node addon was restored from cache.
        if: >
          matrix.kind == 'rust' ||
          matrix.kind == 'verify' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # WebKit/GTK is only needed to *link* treq/tauri (NAPI miss, verify, rust).
        if: >
          matrix.platform == 'ubuntu-22.04' && (
            matrix.kind == 'rust' ||
            matrix.kind == 'verify' ||
            (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
          )
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary (macOS brew of git/jj/gh was ~40s every run).
      - name: Resolve jj release tag
        id: jj
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin/jj
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: >
          (matrix.task == 'test:integration' || matrix.kind == 'rust') &&
          steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            *)
              echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac
          asset="jj-${JJ_TAG}-${target}.tar.gz"
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
            | tar -xz -C "$tmp"
          # tarball may nest the binary; find it
          jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
          test -n "$jj_bin"
          install -m 755 "$jj_bin" .ci-bin/jj

      - name: Save jj CLI cache
        if: >
          (matrix.task == 'test:integration' || matrix.kind == 'rust') &&
          steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin/jj
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        run: |
          git --version
          jj --version
          gh --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: >
          matrix.kind == 'rust' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Build NAPI addon
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        run: |
          npm run build:napi
          test -f target/debug/libtreq_lib.so
          test -f src-tauri/target/index.js

      - name: Save NAPI addon cache
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/libtreq_lib.so
            src-tauri/target/index.js
          key: ${{ steps.napi-cache.outputs.cache-primary-key }}

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          elif [ "${{ matrix.task }}" = "test:integration" ]; then
            npm run test:integration:run
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust' || matrix.kind == 'verify'
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi
