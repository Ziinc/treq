name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    env:
      GIT_VERSION: 2.45.3
      JJ_VERSION: 0.36.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
          - platform: ubuntu-22.04
            kind: js
            task: test
          - platform: ubuntu-22.04
            kind: rust
            task: test
          - platform: macos-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install build dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates gettext libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install build dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install gettext openssl@3 pcre2

      - name: Install pinned git (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          prefix="$HOME/.local"
          mkdir -p "$prefix/src" "$prefix/bin"
          cd "$prefix/src"
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.xz" -o "git-${GIT_VERSION}.tar.xz"
          tar -xf "git-${GIT_VERSION}.tar.xz"
          cd "git-${GIT_VERSION}"
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          export LDFLAGS="-L$(brew --prefix openssl@3)/lib -L$(brew --prefix gettext)/lib"
          export CPPFLAGS="-I$(brew --prefix openssl@3)/include -I$(brew --prefix gettext)/include"
          make configure
          ./configure --prefix="$prefix"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "$prefix/bin" >> $GITHUB_PATH

      - name: Install pinned git (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          prefix="$HOME/.local"
          mkdir -p "$prefix/src" "$prefix/bin"
          cd "$prefix/src"
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.xz" -o "git-${GIT_VERSION}.tar.xz"
          tar -xf "git-${GIT_VERSION}.tar.xz"
          cd "git-${GIT_VERSION}"
          export LDFLAGS="-L/usr/lib/x86_64-linux-gnu"
          export CPPFLAGS="-I/usr/include"
          make configure
          ./configure --prefix="$prefix"
          make -j"$(nproc)"
          make install
          echo "$prefix/bin" >> $GITHUB_PATH

      - name: Install pinned jj CLI
        run: |
          cargo install --locked --force jj-cli --version "$JJ_VERSION"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify pinned tool versions
        run: |
          git --version
          jj --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: matrix.kind == 'rust'
        with:
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust' || matrix.kind == 'verify'
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi
