name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/treq-napi/**"
      - "supabase/**"
      - "web/**"
      - "test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "vitest*.config.ts"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
          # Unit tests: mocked Tauri, no NAPI/jj. Parallel file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:unit
          # Integration tests: NAPI + real jj repos. Serial file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:integration
          - platform: ubuntu-22.04
            kind: rust
            task: test
          - platform: macos-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # Exact-key cache of the compiled addon. Frontend-only PRs restore the
      # binary built on main when Rust inputs are unchanged.
      - name: Restore NAPI addon cache
        id: napi-cache
        if: matrix.task == 'test:integration'
        uses: actions/cache/restore@v4
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: napi-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'crates/treq-napi/Cargo.toml', 'crates/treq-napi/build.rs', 'crates/treq-napi/src/**', 'crates/treq-napi/package.json', 'crates/treq-napi/package-lock.json') }}

      - name: Install Rust stable
        # Unit JS tests never need Rust. Integration skips the toolchain when
        # the prebuilt .node addon was restored from cache.
        if: >
          matrix.kind == 'rust' ||
          matrix.kind == 'verify' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: install dependencies (ubuntu only)
        # WebKit/GTK is only needed to *link* treq/tauri (NAPI miss, verify, rust).
        if: >
          matrix.platform == 'ubuntu-22.04' && (
            matrix.kind == 'rust' ||
            matrix.kind == 'verify' ||
            (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
          )
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install git, jj, and gh CLI (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install git jj gh
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Install jj CLI (ubuntu, binary)
        # Prefer a release binary so integration cache-hits need no Rust toolchain.
        if: matrix.platform == 'ubuntu-22.04' && (matrix.task == 'test:integration' || matrix.kind == 'rust')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          asset="jj-${tag}-x86_64-unknown-linux-musl.tar.gz"
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${tag}/${asset}" \
            | tar -xz -C "$tmp"
          sudo install -m 755 "$tmp/jj" /usr/local/bin/jj
          jj --version

      - name: Install gh CLI (ubuntu)
        # Version pin check for rust runners only; JS tests mock GitHub.
        if: matrix.platform == 'ubuntu-22.04' && matrix.kind == 'rust'
        run: |
          (type -p wget >/dev/null || (sudo apt-get update && sudo apt-get install -y wget)) \
          && sudo mkdir -p -m 755 /etc/apt/keyrings \
          && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
          && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt-get update \
          && sudo apt-get install -y gh

      - name: Verify pinned tool versions
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        run: |
          git --version
          jj --version
          if command -v gh >/dev/null 2>&1; then gh --version; fi

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: >
          matrix.kind == 'rust' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target
            ./crates/treq-napi -> target

      - name: Build NAPI addon
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        run: |
          npm run build:napi
          test -f crates/treq-napi/treq-napi.linux-x64-gnu.node

      - name: Save NAPI addon cache
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: crates/treq-napi/treq-napi.linux-x64-gnu.node
          key: ${{ steps.napi-cache.outputs.cache-primary-key }}

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          elif [ "${{ matrix.task }}" = "test:integration" ]; then
            npm run test:integration:run
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust' || matrix.kind == 'verify'
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi
