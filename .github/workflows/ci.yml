name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: js
            task: verify
          - os: ubuntu-latest
            kind: js
            task: test
          - os: ubuntu-latest
            kind: rust
            task: check
          - os: ubuntu-latest
            kind: rust
            task: test
          - os: macos-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Restore Cargo cache
        uses: actions/cache@v5
        if: matrix.kind == 'rust'
        with:
          path: |
            ~/.cargo
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-
            cargo-${{ runner.os }}-

      - name: Run JS task
        if: matrix.kind == 'js'
        run: |
          if [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust'
        working-directory: src-tauri
        run: |
          if [ "${{ matrix.task }}" = "check" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi
