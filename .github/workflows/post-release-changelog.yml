name: Post-Release Changelog

on:
  release:
    types: [published]

jobs:
  update-changelog:
    name: Rebuild CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --output CHANGELOG.md

      - name: Generate web changelog page
        run: |
          {
            printf -- '---\ntitle: Changelog\ndescription: Release history for Treq\nhide_table_of_contents: true\n---\n\n'
            printf '# Changelog\n\n'
            printf '> Full release history for [Treq](https://github.com/Ziinc/treq/releases).\n\n'
            tail -n +3 CHANGELOG.md
          } > web/src/pages/changelog.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md web/src/pages/changelog.md
          git diff --cached --quiet || git commit -m "chore: update changelog for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
