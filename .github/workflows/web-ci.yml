name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint e2e tests (ast-grep)
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@ast-grep/cli']")
          npm install --no-save --no-package-lock "@ast-grep/cli@${VERSION}"
          ./node_modules/.bin/ast-grep test --skip-snapshot-tests
          ./node_modules/.bin/ast-grep scan web/e2e
