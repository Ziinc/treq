name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/scripts/check_readability.py"

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint e2e tests (ast-grep)
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm run lint:e2e

  readability:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check docs readability
        run: uv run .github/scripts/check_readability.py

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install serve and lighthouse
        working-directory: ${{ github.workspace }}
        run: npm install -g serve lighthouse
      - name: Serve built site
        working-directory: web
        run: serve -s build -l 3000 &
      - name: Wait for server
        working-directory: ${{ github.workspace }}
        run: npx wait-on http://localhost:3000
      - name: Run Lighthouse
        working-directory: ${{ github.workspace }}
        run: |
          lighthouse http://localhost:3000 \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
