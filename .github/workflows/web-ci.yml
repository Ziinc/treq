name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/web-ci.yml"
      - ".github/scripts/check_readability.py"

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint e2e tests (ast-grep)
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm run lint:e2e

  readability:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check docs readability
        run: uv run .github/scripts/check_readability.py
