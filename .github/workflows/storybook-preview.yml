name: Storybook Preview

# Builds Storybook and deploys it to Cloudflare Pages as a per-PR preview, then
# comments a deep link for each story exported by a *.stories.tsx file the PR
# touched (see scripts/storybook/build-pr-comment.mjs). Scope is app
# components (src/components/**) — see .claude/skills/ui-story/SKILL.md for
# how stories get written.
on:
  pull_request:
    paths:
      - "src/components/**"
      - ".storybook/**"
      - "src/index.css"
      - "tailwind.config.js"
      - ".github/workflows/storybook-preview.yml"

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Fork PRs get a read-only GITHUB_TOKEN and no access to the Cloudflare
    # secrets, so both the deploy and the comment step would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview-${{ github.event.pull_request.number }}.treq-storybook.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the base commit present to diff against it.
          fetch-depth: 0

      - name: Find changed story files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three-dot: what this PR changed relative to the merge base, so
          # stories that only moved on main don't get pulled in. ACMR skips
          # deletions (nothing to link to once a file is gone).
          stories=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" \
            -- 'src/**/*.stories.tsx' 'src/**/*.stories.ts' || true)
          echo "Changed story files:"
          echo "${stories:-(none)}"
          {
            echo "stories<<EOF"
            echo "$stories"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=treq-storybook --branch=preview-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build comment body
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          CHANGED_STORIES: ${{ steps.changed.outputs.stories }}
        run: node scripts/storybook/build-pr-comment.mjs > /tmp/pr-comment.md

      - name: Post or update the sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8');
            const marker = '<!-- storybook-preview-link -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
