name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      - name: Install jj (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install jj

      - name: Install jj (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LsSf https://github.com/jj-vcs/jj/releases/latest/download/jj-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C /usr/local/bin

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Verify jj installation
        run: jj --version

      - name: Verify git installation
        run: git --version

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"
          git config --global init.defaultBranch main

      - name: Run e2e tests
        working-directory: ./src-tauri
        run: cargo test --test e2e_workspace_tests -- --test-threads=1

      - name: Run unit tests
        working-directory: ./src-tauri
        run: cargo test --lib