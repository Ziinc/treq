id: no-test-banner-comments-rust
language: rust
severity: warning
message: >
  Do not use banner-style separator comments in Rust files. Use descriptive
  test function names instead of `===`, `---`, or `###` section dividers.
files:
  - "src-tauri/**/*_test.rs"
  - "src-tauri/**/*.rs"
rule:
  kind: source_file
  # Disallow comment-only separator lines like:
  # // =====
  # // -----
  # // #####
  regex: (?m)^// (?:(?:={3,})|(?:-{3,})|(?:#{3,}))$
