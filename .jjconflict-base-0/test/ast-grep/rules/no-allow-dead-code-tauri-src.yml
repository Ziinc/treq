id: no-allow-dead-code-tauri-src
language: rust
severity: error
message: >
  Do not use #[allow(dead_code)] under src-tauri/src. Remove dead code, wire it
  up, or use a narrower lint allowance if you must suppress something specific.
files:
  - "src-tauri/src/**/*.rs"
rule:
  any:
    - pattern: "#[allow(dead_code)]"
    - pattern: "#[allow(dead_code, $$$A)]"
    - pattern: "#[allow($$$A, dead_code)]"
    - pattern: "#[allow($A, dead_code)]"
    - pattern: "#[allow($A, dead_code, $B)]"
    - pattern: "#[allow($A, $B, dead_code)]"
    - pattern: "#[allow($A, $B, dead_code, $C)]"
    - pattern: "#[allow($A, dead_code, $B, $C)]"
    - pattern: "#[allow(dead_code, $A, $B, $C)]"
