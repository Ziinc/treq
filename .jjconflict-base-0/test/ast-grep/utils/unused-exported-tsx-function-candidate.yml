id: unused-exported-tsx-function-candidate
language: tsx
files:
  - "src/**/*.tsx"
rule:
  any:
    - pattern: "export function $NAME($$$ARGS) { $$$BODY }"
    - pattern: "export async function $NAME($$$ARGS) { $$$BODY }"
    - pattern: "export function $NAME($$$ARGS): $RET { $$$BODY }"
    - pattern: "export async function $NAME($$$ARGS): $RET { $$$BODY }"
    - pattern: "export function $NAME<$T>($$$ARGS) { $$$BODY }"
    - pattern: "export async function $NAME<$T>($$$ARGS) { $$$BODY }"
    - pattern: "export function $NAME<$T>($$$ARGS): $RET { $$$BODY }"
    - pattern: "export async function $NAME<$T>($$$ARGS): $RET { $$$BODY }"
    - pattern: "export const $NAME = $VALUE"
