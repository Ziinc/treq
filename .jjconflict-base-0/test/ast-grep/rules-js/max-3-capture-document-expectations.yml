id: max-3-capture-document-expectations
language: tsx
severity: error
message: >
  A captureDocument() call may list at most 3 expectations.
  Keep the 3 claims that actually distinguish this screenshot from a broken one,
  and move the rest into a separate capture with its own name.
files:
  - "scripts/screenshot/specs/**/*.tsx"
rule:
  kind: array
  has:
    nthChild: 4
  inside:
    kind: pair
    has:
      field: key
      regex: "^expectations$"
    inside:
      stopBy: end
      kind: call_expression
      has:
        field: function
        regex: "^captureDocument$"
