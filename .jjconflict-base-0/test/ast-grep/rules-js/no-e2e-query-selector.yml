id: no-e2e-query-selector
language: typescript
severity: error
message: >
  Do not use deprecated Playwright query selector methods ($, $$, $eval, $$eval).
  These bypass accessibility semantics. Use page.getByRole(), page.getByText(), etc. instead.
files:
  - "web/e2e/**/*.ts"
rule:
  kind: call_expression
  regex: \.\$\$?(?:eval)?\(
