id: no-jj-cli-in-tests
language: typescript
severity: error
message: >
  Do not shell out to the `jj` CLI from tests. The integration suite talks to
  jj-lib through the napi addon, so a `jj` binary is not guaranteed to be on
  PATH. Use the test helpers in `test/utils.tsx` (`resolveCommitId`,
  `resolveRevsetCommitIds`, `newCommitWithParents`) or add a napi helper in
  `crates/treq-napi/src/helpers.rs` instead.
files:
  - "test/**/*.ts"
  - "test/**/*.tsx"
rule:
  any:
    - pattern: execFileSync("jj", $$$)
    - pattern: execFile("jj", $$$)
    - pattern: spawnSync("jj", $$$)
    - pattern: spawn("jj", $$$)
    - pattern: $_.execFileSync("jj", $$$)
    - pattern: $_.execFile("jj", $$$)
    - pattern: $_.spawnSync("jj", $$$)
    - pattern: $_.spawn("jj", $$$)
