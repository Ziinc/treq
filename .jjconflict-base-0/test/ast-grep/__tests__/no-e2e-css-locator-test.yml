id: no-e2e-css-locator
valid:
  - |
    page.getByRole('link', { name: 'Guides' });
  - |
    page.getByText('Get Started');
  - |
    page.getByLabel('Search');
  - |
    page.locator('text=Guides');
invalid:
  - |
    page.locator('nav.navbar');
  - |
    page.locator('.menu-item');
  - |
    page.locator('#main-nav a');
  - |
    page.locator('button.primary');
