id: no-everything-matcher-tauri-src
valid:
  - |
    use jj_lib::matchers::{NothingMatcher, PrefixMatcher};

    fn matcher() {
      let _ = PrefixMatcher::new([RepoPath::root()]);
      let _ = &NothingMatcher;
    }
invalid:
  - |
    use jj_lib::matchers::EverythingMatcher;
  - |
    use jj_lib::matchers::{NothingMatcher, EverythingMatcher};
  - |
    fn matcher() {
      let _ = &EverythingMatcher;
    }
