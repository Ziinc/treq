id: no-e2e-js-evaluate
valid:
  - |
    await page.getByRole('button').click();
  - |
    await expect(page.getByRole('heading', { name: 'Guides' })).toBeVisible();
invalid:
  - |
    await page.evaluate(() => document.querySelector('.nav'));
  - |
    await page.evaluateHandle(() => window.location);
  - |
    await locator.evaluateAll(els => els.length);
  - |
    await page.addInitScript(() => { window.foo = 'bar'; });
