id: tauri-command-function-name
language: Rust
files:
  - src-tauri/src/**/*.rs
rule:
  any:
    - pattern:
        context: |
          #[tauri::command]
          pub fn $NAME($$$ARGS) -> $RET { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          pub fn $NAME($$$ARGS) { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          pub async fn $NAME($$$ARGS) -> $RET { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          pub async fn $NAME($$$ARGS) { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          fn $NAME($$$ARGS) -> $RET { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          fn $NAME($$$ARGS) { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          async fn $NAME($$$ARGS) -> $RET { $$$BODY }
        selector: function_item
    - pattern:
        context: |
          #[tauri::command]
          async fn $NAME($$$ARGS) { $$$BODY }
        selector: function_item
