id: no-e2e-query-selector
valid:
  - |
    page.getByRole('link', { name: 'Guides' });
  - |
    page.getByRole('navigation', { name: 'Main' });
invalid:
  - |
    await page.$('nav.navbar');
  - |
    await page.$$('.menu-item');
  - |
    await page.$eval('.button', el => el.textContent);
  - |
    await page.$$eval('.items', els => els.length);
