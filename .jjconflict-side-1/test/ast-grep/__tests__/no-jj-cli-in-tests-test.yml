id: no-jj-cli-in-tests
valid:
  - |
    const commitId = resolveCommitId(workspacePath, "@-");
  - |
    newCommitWithParents(workspacePath, [workspaceCommitId, mainCommitId]);
  - |
    const tip = execFileSync("git", ["rev-parse", "feat/beta"], { cwd });
invalid:
  - |
    execFileSync("jj", ["log", "-r", "@-", "--no-graph", "-T", "commit_id"], { cwd });
  - |
    spawnSync("jj", ["new", a, b], { cwd });
  - |
    childProcess.execFile("jj", ["status"], { cwd });
