id: no-jj-cli-in-tests
snapshots:
  ? |
    childProcess.execFile("jj", ["status"], { cwd });
  : labels:
    - source: childProcess.execFile("jj", ["status"], { cwd })
      style: primary
      start: 0
      end: 48
  ? |
    execFileSync("jj", ["log", "-r", "@-", "--no-graph", "-T", "commit_id"], { cwd });
  : labels:
    - source: execFileSync("jj", ["log", "-r", "@-", "--no-graph", "-T", "commit_id"], { cwd })
      style: primary
      start: 0
      end: 81
  ? |
    spawnSync("jj", ["new", a, b], { cwd });
  : labels:
    - source: spawnSync("jj", ["new", a, b], { cwd })
      style: primary
      start: 0
      end: 39
