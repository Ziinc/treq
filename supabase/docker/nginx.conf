worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  client_max_body_size 50m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Single public entrypoint (Kong-compatible paths).
  # No /auth/v1 — single-tenant self-hosted mode has no GoTrue.
  server {
    listen 8000;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # PostgREST. Strip /rest/v1 prefix.
    location /rest/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Forward apikey as Authorization when Authorization is absent.
      set $auth_header $http_authorization;
      if ($auth_header = "") {
        set $auth_header "Bearer $http_apikey";
      }
      proxy_set_header Authorization $auth_header;
      proxy_pass http://127.0.0.1:3000/;
    }

    # Edge Functions. Strip /functions/v1 prefix → main router sees /<fn>/...
    location /functions/v1/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_pass http://127.0.0.1:9000/;
    }
  }
}
