id: no-nested-component-definitions
language: tsx
severity: error
message: >
  Do not define a component inside another component. Hoist PascalCase
  functions to module scope so they keep a stable identity across renders.
files:
  - "src/**/*.tsx"
rule:
  all:
    - any:
        - pattern: const $NAME = ($$$P) => $$$B
        - pattern: const $NAME = ($$$P) => { $$$B }
        - pattern: "const $NAME: $T = ($$$P) => $$$B"
        - pattern: "const $NAME: $T = ($$$P) => { $$$B }"
        - pattern: function $NAME($$$P) { $$$B }
    - inside:
        stopBy: end
        any:
          - kind: arrow_function
          - kind: function_declaration
          - kind: function_expression
          - kind: method_definition
constraints:
  NAME:
    regex: "^[A-Z]"
