id: no-e2e-css-locator
language: typescript
severity: error
message: >
  Do not use CSS-based selectors in e2e tests.
  Replace page.locator('css') with page.getByRole(), page.getByText(), page.getByLabel(), etc.
files:
  - "web/e2e/**/*.ts"
rule:
  pattern: $_.locator($CSS)
constraints:
  CSS:
    regex: "^['\"](?:[a-z][\\w-]*)?[.#][\\w-]"
