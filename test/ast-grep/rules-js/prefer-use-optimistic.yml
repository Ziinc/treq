id: prefer-use-optimistic
language: tsx
severity: error
message: >
  Use useOptimistic instead of copying state, updating it, then restoring
  the copy in catch. React reverts the optimistic value if the action
  fails. This is local UI only; it will not refresh a shared query cache.
files:
  - "src/**/*.tsx"
rule:
  any:
    - pattern: const previous = $STATE
    - pattern: const prev = $STATE
    - pattern: const snapshot = $STATE
