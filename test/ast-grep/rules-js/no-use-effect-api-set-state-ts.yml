id: no-use-effect-api-set-state-ts
language: typescript
severity: error
message: >
  Do not fetch in useEffect. Prefer useSWR for server reads; use useMutation
  for writes. Subscribe to DOM/Tauri events, matchMedia, debounce, and
  xterm/monaco layout in effects.
files:
  - "src/**/*.ts"
ignores:
  - "src/hooks/useDebounce.ts"
rule:
  all:
    - pattern: useEffect($$$ARGS)
    - has:
        stopBy: end
        any:
          - pattern: await $CALL($$$A)
          - pattern: $CALL($$$A).then($$$B)
          - pattern: $CALL($$$A).catch($$$B)
    - not:
        regex: \b(addEventListener|matchMedia|listen|onFocusChanged)\s*(?:<[^>]*>)?\s*\(
    - not:
        regex: \bnew XTerm\s*\(
