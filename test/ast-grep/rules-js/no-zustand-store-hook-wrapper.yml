id: no-zustand-store-hook-wrapper
language: tsx
severity: error
message: >
  Select from the Zustand store in the component. Do not add a use* hook
  that only wraps use*Store.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
ignores:
  - "src/stores/**"
  - "src/components/ui/toast.tsx"
rule:
  all:
    - kind: export_statement
    - has:
        stopBy: end
        regex: \buse[A-Z][A-Za-z0-9]*Store\s*\(
    - any:
        - has:
            kind: function_declaration
            regex: "^function use"
        - has:
            kind: lexical_declaration
            regex: "^const use"
