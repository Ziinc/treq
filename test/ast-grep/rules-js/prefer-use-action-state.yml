id: prefer-use-action-state
language: tsx
severity: error
message: >
  Use useActionState for submit pending and error state instead of
  setSubmitting around try/catch. The hook tracks in-flight work and
  returns the error from the action. It does not replace a shared cache
  (TanStack Query still owns server data other components read).
files:
  - "src/components/**/*.tsx"
rule:
  pattern: setSubmitting(true)
