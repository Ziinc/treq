id: no-e2e-direct-url-goto
language: typescript
severity: error
message: >
  Do not navigate directly to an internal URL in e2e tests.
  Always start from the landing page (page.goto('/')) and reach other pages via UI interactions.
files:
  - "web/e2e/**/*.ts"
rule:
  pattern: page.goto($URL)
constraints:
  URL:
    regex: "^['\"][/][^'\"]"
