id: no-retry-in-tests
language: typescript
severity: error
message: >
  Do not use a `retry` option in test files. A test that needs a retry to pass
  reliably has a real race in the app or the test harness -- retrying hides it
  instead of fixing it. Fix the underlying non-determinism instead.
files:
  - "test/**/*.ts"
  - "test/**/*.tsx"
rule:
  any:
    - pattern: "it($$$, { retry: $_, $$$ })"
    - pattern: "it($$$, { $$$, retry: $_, $$$ })"
    - pattern: "test($$$, { retry: $_, $$$ })"
    - pattern: "test($$$, { $$$, retry: $_, $$$ })"
    - pattern: it.retry($$$)
    - pattern: test.retry($$$)
    - pattern: "describe($$$, { retry: $_, $$$ })"
    - pattern: "describe($$$, { $$$, retry: $_, $$$ })"
    - pattern: "vi.setConfig({ retry: $_, $$$ })"
    - pattern: "vi.setConfig({ $$$, retry: $_, $$$ })"
