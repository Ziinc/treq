id: no-forward-ref
language: tsx
severity: error
message: >
  Do not use forwardRef. Pass ref as a normal prop (React 19).
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "test/mocks/**/*.ts"
  - "test/mocks/**/*.tsx"
rule:
  any:
    - pattern: forwardRef($$$A)
    - pattern: React.forwardRef($$$A)
    - pattern: forwardRef<$A, $B>($$$C)
    - pattern: React.forwardRef<$A, $B>($$$C)
    - kind: import_specifier
      regex: "forwardRef"
