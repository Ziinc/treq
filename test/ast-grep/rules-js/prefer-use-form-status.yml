id: prefer-use-form-status
language: tsx
severity: error
message: >
  Do not pass isSubmitting into a child of a form. Put the submit button
  in its own component and call useFormStatus so it can read pending
  state from the nearest form action.
files:
  - "src/**/*.tsx"
rule:
  any:
    - kind: identifier
      regex: "^isSubmitting$"
    - kind: property_identifier
      regex: "^isSubmitting$"
    - kind: shorthand_property_identifier_pattern
      regex: "^isSubmitting$"
