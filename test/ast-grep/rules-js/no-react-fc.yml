id: no-react-fc
language: tsx
severity: warning
message: >
  Do not type components as React.FC. Use a named function or const with an
  explicit props argument, including children when needed.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
rule:
  kind: nested_type_identifier
  regex: "^React\\.(FC|FunctionComponent)$"
