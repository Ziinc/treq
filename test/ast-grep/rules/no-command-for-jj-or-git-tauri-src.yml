id: no-command-for-jj-or-git-tauri-src
language: rust
severity: error
message: >
  Avoid shelling out via `command_for("jj")` or `command_for("git")` in
  `src-tauri/src`. Prefer direct `jj-lib` APIs, using the `jj-cli`
  implementation as the behavioral reference.
files:
  - "src-tauri/src/**/*.rs"
rule:
  any:
    - pattern: 'command_for("jj")'
    - pattern: 'command_for("git")'
