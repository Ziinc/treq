id: require-tauri-invoke-via-api-wrappers
language: typescript
severity: error
message: >
  Tauri commands must be invoked from src/lib/api.ts or src/lib/api-extra.ts. Add or
  use an API wrapper instead of calling invoke directly here.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
ignores:
  - "src/lib/api.ts"
  - "src/lib/api-extra.ts"
  - "src/lib/api-github.ts"
rule:
  all:
    - pattern: invoke($CMD, $$$)
    - any:
        - kind: call_expression
