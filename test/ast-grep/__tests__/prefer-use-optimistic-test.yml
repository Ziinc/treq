id: prefer-use-optimistic
valid:
  - |
    const [likes, setLikes] = useState(count);
    const [optimisticLikes, addOptimistic] = useOptimistic(likes, (n, next) => next);
    const like = async () => {
      addOptimistic(likes + 1);
      await saveLike(likes + 1);
    };
  - |
    const { mutate } = useMutation({ mutationFn: save });
invalid:
  - |
    const like = async () => {
      const previous = likes;
      setLikes(likes + 1);
      try {
        await saveLike(likes + 1);
      } catch (err) {
        setLikes(previous);
      }
    };
