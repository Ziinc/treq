id: no-use-effect-api-set-state-ts
valid:
  - |
    useEffect(() => {
      const handler = setTimeout(() => setDebouncedValue(value), delay);
      return () => clearTimeout(handler);
    }, [value, delay]);
  - |
    const { data } = useSWR(["commits", repoPath], () => listCommits(repoPath));
invalid:
  - |
    useEffect(() => {
      const load = async () => {
        const review = await loadFileBrowserReview(repoPath, workspaceId);
        setComments(review.comments);
      };
      load();
    }, [repoPath, workspaceId]);
  - |
    useEffect(() => {
      getSettingsBatch(["theme"]).catch((error) => {
        console.error(error);
      });
    }, []);
