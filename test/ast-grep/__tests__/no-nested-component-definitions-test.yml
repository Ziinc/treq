id: no-nested-component-definitions
valid:
  - |
    const StatusPip = ({ status }: { status?: string }) =>
      status ? <span className="pip" /> : null;

    export const FileTreeView = ({ nodes }) => (
      <div>{nodes.map((n) => <StatusPip key={n.path} status={n.status} />)}</div>
    );
  - |
    export function Header() {
      const onClick = () => close();
      return <button onClick={onClick}>Close</button>;
    }
  - |
    export const Pane = memo(function Pane({ title }: { title: string }) {
      return <h1>{title}</h1>;
    });
invalid:
  - |
    export const ShowWorkspace = memo(() => {
      const StatusPip = ({ status }: { status?: string }) =>
        status ? <span className="pip" /> : null;
      return <StatusPip status="M" />;
    });
  - |
    export function Panel() {
      function Row({ label }: { label: string }) {
        return <div>{label}</div>;
      }
      return <Row label="x" />;
    }
