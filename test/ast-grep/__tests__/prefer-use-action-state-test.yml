id: prefer-use-action-state
valid:
  - |
    const [error, action, isPending] = useActionState(async (_prev, formData) => {
      await save(formData.get("name"));
      return null;
    }, null);
    return <form action={action}><button type="submit" disabled={isPending}>Save</button>{error}</form>;
  - |
    const { isPending } = useQuery({ queryKey: ["x"], queryFn: fetchX });
invalid:
  - |
    const handleSave = async () => {
      setSubmitting(true);
      setError("");
      try {
        await save();
      } catch (err) {
        setError(String(err));
      } finally {
        setSubmitting(false);
      }
    };
  - |
    async function handleRename() {
      setSubmitting(true);
      try {
        await rename();
      } catch (e) {
        setError(e.message);
      }
    }
