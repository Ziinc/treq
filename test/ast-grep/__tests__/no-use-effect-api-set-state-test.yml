id: no-use-effect-api-set-state
valid:
  - |
    useEffect(() => {
      const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
      setSystemTheme(mediaQuery.matches ? "dark" : "light");
      mediaQuery.addEventListener("change", handler);
      return () => mediaQuery.removeEventListener("change", handler);
    }, []);
  - |
    useEffect(() => {
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, []);
  - |
    useEffect(() => {
      const unlisten = listen("navigate-to-settings", openSettings);
      return () => {
        unlisten.then((fn) => fn());
      };
    }, []);
  - |
    const { data } = useSWR(["commits", repoPath], () => listCommits(repoPath));
  - |
    useEffect(() => {
      const handler = setTimeout(() => setDebouncedValue(value), delay);
      return () => clearTimeout(handler);
    }, [value, delay]);
invalid:
  - |
    useEffect(() => {
      listCommits(repoPath).then((result) => {
        setCommits(result.commits);
      });
    }, [repoPath]);
  - |
    useEffect(() => {
      const load = async () => {
        const review = await loadFileBrowserReview(repoPath, workspaceId);
        setComments(review.comments);
      };
      load();
    }, [repoPath, workspaceId]);
  - |
    useEffect(() => {
      getSetting("theme").then((savedTheme) => {
        setThemeState(savedTheme);
      });
    }, []);
