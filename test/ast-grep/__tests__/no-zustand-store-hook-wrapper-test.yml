id: no-zustand-store-hook-wrapper
valid:
  - |
    export function SettingsPage() {
      const theme = useThemeStore((s) => s.theme);
      const setTheme = useThemeStore((s) => s.setTheme);
      return <button onClick={() => setTheme("dark")}>{theme}</button>;
    }
  - |
    export function AppStoreEffects() {
      const zoom = useZoomSettingsStore((s) => s.zoom);
      useEffect(() => {
        applyZoomToDocument(zoom);
      }, [zoom]);
      return null;
    }
  - |
    export function useDebounce<T>(value: T, delay: number): T {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const id = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(id);
      }, [value, delay]);
      return debounced;
    }
  - |
    export function TreqSendProvider({ children }: { children: ReactNode }) {
      useEffect(() => {
        listen(TREQ_SEND_EVENT, (event) => {
          useTreqSendStore.getState().ingestPayload(event.payload);
        });
      }, []);
      return children;
    }
invalid:
  - |
    export function useTheme() {
      const theme = useThemeStore((s) => s.theme);
      const setTheme = useThemeStore((s) => s.setTheme);
      return { theme, setTheme };
    }
  - |
    export const useAuth = () => {
      const user = useAuthStore((s) => s.user);
      const signIn = useAuthStore((s) => s.signIn);
      return { user, signIn };
    }
  - |
    export function useTreqSend() {
      const assets = useTreqSendStore((s) => s.assets);
      const ingestPayload = useTreqSendStore((s) => s.ingestPayload);
      return { assets, ingestPayload };
    }
