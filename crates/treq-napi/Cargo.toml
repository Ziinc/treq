[package]
name = "treq-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
treq_lib = { package = "treq", path = "../../src-tauri" }

[build-dependencies]
napi-build = "2"
